<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Saver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Bookmark Saver🥑</h1>
      <div class="input-container">
        <input type="text" id="bookmark-name" placeholder="Bookmark Name" />
        <input type="text" id="bookmark-url" placeholder="Bookmark URL" />
        <input type="text" id="bookmark-tag" placeholder="Tag (Optional)" />
        <button id="add-bookmark">Add Bookmark</button>
      </div>
      <div class="controls-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search by Name or Tag..."
        />
        <select id="sort-select">
          <option value="date-desc">Newest First</option>
          <option value="date-asc">Oldest First</option>
          <option value="alpha-asc">A-Z</option>
          <option value="alpha-desc">Z-A</option>
        </select>
      </div>
      <ul id="bookmark-list">
        <!-- Bookmarks will be added here -->
      </ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
